<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surat & Lagu Untuk Awak</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        @page {
            size: A4;
            margin: 20mm;
            background-color: #f7f1ec;
        }
        *, *::before, *::after {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Quicksand', sans-serif;
            background-color: #f7f1ec;
            color: #4a4238;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            text-align: center;
            background: #fffbf9;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(110, 95, 85, 0.15);
            border: 1px solid #e6ded6;
            max-width: 400px;
            width: 100%;
            margin: auto;
        }
        .flower-icon {
            font-size: 60px;
            margin-bottom: 20px;
        }
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            margin-bottom: 10px;
            color: #4a3b32;
        }
        p {
            font-size: 14px;
            color: #6e6053;
            margin-bottom: 25px;
            line-height: 1.6;
        }
        .audio-box {
            margin-top: 20px;
        }
        audio {
            width: 100%;
            outline: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="flower-icon">💐</div>
        <h1>Songs For You</h1>
        <p>Surat dan lagu istimewa untuk awak. Tekan butang play di bawah untuk mendengar melodi ini.</p>
        
        <div class="audio-box">
            <audio controls autoplay>
                <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf756.mp3?filename=lofi-study-112191.mp3" type="audio/mpeg">
                Pelayar web anda tidak menyokong elemen audio.
            </audio>
        </div>
    </div>

</body>
</html>
