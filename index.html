<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surat & Lagu Untuk Awak</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Quicksand', sans-serif;
            background-color: #f7f1ec;
            color: #4a4238;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            text-align: center;
            background: #fffbf9;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(110, 95, 85, 0.15);
            border: 1px solid #e6ded6;
            max-width: 380px;
            width: 90%;
        }

        /* Jambangan bunga artistik berasaskan emoji */
        .bouquet-art {
            width: 140px;
            height: 140px;
            background: linear-gradient(135deg, #fce4ec, #f8bbd0);
            border-radius: 50%;
            margin: 0 auto 15px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: 0 8px 20px rgba(216, 131, 149, 0.25);
            animation: float 3s ease-in-out infinite;
        }

        .flower-item {
            position: absolute;
            font-size: 28px;
        }

        /* Susunan kelopak bunga keliling */
        .f1 { top: 15px; left: 50px; }
        .f2 { top: 40px; right: 20px; }
        .f3 { bottom: 25px; right: 35px; }
        .f4 { bottom: 25px; left: 35px; }
        .f5 { top: 40px; left: 20px; }
        .f6 { top: 52px; left: 52px; font-size: 34px; }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            margin-bottom: 8px;
            color: #4a3b32;
        }

        p {
            font-size: 13px;
            color: #6e6053;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .audio-box {
            margin-top: 15px;
        }

        audio {
            width: 100%;
            outline: none;
            border-radius: 20px;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="bouquet-art">
            <span class="flower-item f1">🌸</span>
            <span class="flower-item f2">🌹</span>
            <span class="flower-item f3">🌷</span>
            <span class="flower-item f4">🌿</span>
            <span class="flower-item f5">✨</span>
            <span class="flower-item f6">💐</span>
        </div>
        <h1>Songs For You</h1>
        <p>Jambangan bunga istimewa dan melodi indah khusus untuk awak hari ni.</p>
        
        <div class="audio-box">
            <audio controls>
                <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf756.mp3?filename=lofi-study-112191.mp3" type="audio/mpeg">
                Pelayar web anda tidak menyokong elemen audio.
            </audio>
        </div>
    </div>

</body>
</html>
